name: Validación rápida del frontend

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-push-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, tipos, pruebas y compilación
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar código
        uses: actions/checkout@v7

      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Revisar código
        run: npm run lint

      - name: Revisar tipos
        run: npm run type-check

      # Mientras el proyecto no tenga script "test", este paso no falla.
      # Cuando las pruebas estén listas, cambiar a: npm test
      - name: Ejecutar pruebas unitarias disponibles
        run: npm run test --if-present
        env:
          CI: true

      - name: Restaurar caché de Next.js
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-


      - name: Compilar frontend
        run: npm run build
        env:
          API_URL: http://localhost:5000

  trivy:
    name: Analizar dependencias y archivos
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar código
        uses: actions/checkout@v7

      - name: Ejecutar Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
