name: Publicar y desplegar frontend QA

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: frontend-staging
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  STAGING_API_URL: https://api-staging.sotra-app.online

jobs:
  publish:
    if: github.ref == 'refs/heads/qa'
    name: Construir y publicar imagen QA
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      image: ${{ steps.image.outputs.name }}
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Descargar codigo QA
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Obtener version unica de QA
        id: version
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "value=qa-1.0.${GITHUB_RUN_NUMBER}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Normalizar nombre de la imagen
        id: image
        shell: bash
        run: echo "name=${REGISTRY}/${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - name: Preparar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Iniciar sesion en GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Etiquetas y metadatos
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ steps.version.outputs.value }}
            type=raw,value=qa
          labels: |
            org.opencontainers.image.title=SOTRA Frontend QA
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.value }}

      - name: Construir y publicar QA
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            API_URL=${{ env.STAGING_API_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true

  deploy:
    needs: publish
    if: vars.ENABLE_STAGING_DEPLOY == 'true'
    name: Actualizar frontend en VPS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    steps:
      - name: Configurar SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Desplegar exclusivamente frontend staging
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "$VPS_USER@$VPS_HOST" \
            'cd /opt/apps/sotra-staging && docker compose --env-file .env.staging -f compose.staging.yml pull frontend && docker compose --env-file .env.staging -f compose.staging.yml up -d --no-deps frontend'

      - name: Smoke test frontend QA
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 https://staging.sotra-app.online/
