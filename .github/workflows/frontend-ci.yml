name: Validar frontend

on:
  pull_request:
  push:
    branches:
      - principal
      - desarrollo

permissions:
  contents: read

jobs:
  quality:
    name: Calidad y compilación
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v6

      - name: Preparar Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Revisar tipos
        run: npm run type-check

      - name: Revisar código
        run: npm run lint

      - name: Ejecutar pruebas
        run: npm test

      - name: Compilar frontend
        run: npm run build
        env:
          API_URL: http://localhost:5000

      - name: Validar imagen del frontend
        run: docker build --build-arg API_URL=http://localhost:5000 --tag sotra-frontend:ci .
