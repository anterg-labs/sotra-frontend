name: Publicar imagen del frontend

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publicar en GitHub Container Registry
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v6

      - name: Preparar nombre de imagen
        id: container-image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/sotra-frontend" >> "$GITHUB_OUTPUT"

      - name: Preparar metadatos
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.container-image.outputs.name }}
          tags: |
            type=ref,event=tag
            type=sha

      - name: Iniciar sesión en el registro
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Preparar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Construir y publicar imagen
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            API_URL=${{ vars.API_URL }}
