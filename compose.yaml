services:
  sotra-frontend-prod: #renombre el servicio y cada uno esta pensado para diferente enfoque
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        API_URL: ${API_URL}
    image: sotra-frontend-prod
    container_name: sotra-frontend-prod
    ports:
      - "80:3000" # mantuve tu puerto 3100

# este servicio refleja los cambios en tiempo real: la carpeta del proyecto esta montada dentro del contenedor
  sotra-frontend-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: sotra-frontend:dev
    container_name: sotra-frontend-dev
    ports:
      - "80:3000"
    restart: unless-stopped
    env_file:
      - .env.dev
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next

# este es por su qures correr unicamente los unitest dentro del contendor y ta, solo hace eso
  sotra-frontend-test:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: sotra-frontend:dev
    container_name: sotra-frontend-test
    command:
      [
        "sh",
        "-c",
        "npm run test:run 2>/dev/null || npm run test -- --run",
      ]
    profiles:
      - tools

# este es por su qures correr unicamente los lints dentro del contendor y solo hace eso
  sotra-frontend-lint:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: sotra-frontend:dev
    container_name: sotra-frontend-lint
    command:
      [
        "sh",
        "-c",
        "npm run lint",
      ]
    profiles:
      - tools
